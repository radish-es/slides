### Municipal Food Waste Governance 🥕♻️🏡

#### Property, Public Order, and Police

<p style="font-size: 0.5em">Jamie Baxter, Schulich School of Law, Dalhousie</p> 

--

### How do local governments *actually* govern food waste in practice?

<aside class="notes">

Answer might seem obvious: "waste management" is a core municipal function.

But the more I think about it, the more I wonder if we really understand much about the answer to this essential question.

</aside>

--

#### An Example: Organics Bans

![](halifax.jpg)

<small style="text-align: left;">Source: *[Halifax Regional Municipality](https://www.halifax.ca/home-property/garbage-recycling-green-cart/green-carts-leaf-yard-material/food-isnt-garbage)*</small>

<aside class="notes">

Municipal organics waste disposal bans--rules against putting food in the trash for land-filling--have been little used but much discussed as a key regulatory tool for cities to want to combat food waste.

For example, a small number of regional municipalities in BC and Metro Vancouver have enacted organic waste bans in the last decade. But many cities and towns still don't prohibit disposal of organics into landfill (where it generates high levels of methane). 

</aside>

--



![](ns-solid-wate-regs.jpg)

<aside class="notes">

At a provincial level, only NS and PEI have organic bans that extend across an entire province. 

NS has banned compostable organic material from its landfills since 1997. And much of the work of implementing this has been done by municipal governments. 

</aside>

--

![](divert-audit-2024.jpg)

<small style="text-align: left;">Source: [Divert Nova Scotia Landfill Waste Audit 2023](https://divertns.ca/sites/default/files/researchreportsfiles/2024-04/2023%20NS%20Provincial%20Waste%20Audit.pdf)</small>

<aside class="notes">

Most recent waste audit by DiverNS = 2023

Result is shocking: "organics" is the largest category of combined residential and combined ICI waste. Together with "fibre", this represents over 38% of waste in the province.

I don't meant to suggest that organics bans are bad policy, or that they are necessarily ineffective. 

- We don't know where these number started in NS in the mid-1990s. Data from Vancouver suggests a reduction in the order of 30% of organic waste in the first year following the ban

At the same time, the NS numbers suggest that organics bans might only be able to take us so far in even the most basic goal of keeping food waste out of the landfill. 

To me, the interesting question is not so much about "effectiveness", but about "regulatory fit". What kind of regulation are organics bans?

</aside>

--

### Organics bans 🗑️ are...

- Highly formalized (encoded in regs)
- Bright-line rules (universal in application)
- Designed for people (structure incentives)

<aside class="notes">

Some notable features of organics ban:

- highly formalized--written in detail--in regulatory schematics like the one I showed you earlier, and they those formalities are heavily publicized (public education being a key component)

- function by setting a clear bright-line rule and rely on strict enforcement: no compostable organics in landfills

- while they purport to be a ban on things ("organics"), their main regulatory subject is unquestionably "people" = they are designed to disincentivize certain behaviours (throwing food in the trash) by levying financial penalities in the form of increased tipping fees at the disposal site against waste haulers, who are the easiest aggregate party to target for public enforcement and can presumably monitor and enforce upstream

In other words, organics bans look like much of conventional environmental governance--i.e.classic top-down regulation in the liberal welfare state. 

But the question is whether these are good or appropriate regulatory tools for *municipal* governments. The data on compliance could have many explanations--but I'm interested in understanding whether or not some aspect of this story is about the "fit" between certain kinds regulatory tools and the "governmentalities" specific to local government. 

</aside>

---

### How do local governments *actually* govern food waste?

<hr>

1. the circular food economy ♻️
2. municipal police-like powers 🏡

<aside class="notes">

Claim: we have a lot of great ideas about things that local governments can do to reduce and sustainably manage food waste, but we do not really have any coherent idea about *how* municipalities actually govern food waste or what distinguishes them from other governmental actors in this space. 

Thesis: this gap in our understanding is related to a deeper blindspot in Canadian municipal law about the status and meaning of what in other times and places has been called the *municipal police power*: that is, the power to pass bylaws for the regulation of public order (including public health, safety, and morality). 

The police power--or its Canadian equivalent--is thought to operate according to a very different set of logics, or "governmentality", than the classic liberal regulatory governance we see at work in organics bans. 

My own sense is that if we can better understand the degree to which a Canadian version of the police power still operates in contemporary local government, the we may be able to answer the question of how municipalities govern food waste and possibly to the question of how they *should* govern good waste to be most effective in their role. 

Two steps in my argument:

1. Circular food economy: food waste's circular economy dictates (1) that "waste" becomes a valuable resource and therefore subject to overlapping property regimes where little or none existed before and (2) that the "disorder" of entropy in the linear economy be replaced by an orderly circularity of resource flows.

2. Police power: these two elements of the CE -- property and public order -- are exactly those amenable to regulation by municipal "police". 

</aside>

--

### Circular Economy ♻️

![](circular.svg)

<aside class="notes">

The circular economy is an attempt to transition away from linear economic processes and to reconceive "waste" as resource--a valued and valuable commodity that is both produced by and will serve as an input into linked sites of economic production. 

</aside>

--

![](property-public-order.jpg)


<aside class="notes">

For food "waste", the CE means primarily re-envisioning unused food as both a private and public asset that can be:

- redirected to other consumers;
- composted for re-integration into agricultural production or other soil-based uses;
- re-purposed for non-human animal food; or 
- collected as an input for biogas production 

But we might also say that the CE has two particular *legal* consequences:

(1) CE presupposes the "propertization" of formerly valueless goods by reframing them as valuable inputs into some further process of economic production. 

- This could lead to regimes of private ownership, public ownership or even the development and governance of a commons--or some overlap of each of these.

- Notice that this "propertization" of food waste doesn't just shift property relations around the food itself, it also, potentially, alters the legal status of places involved in its production. Private homes, for example, as generators of food waste suddenly start to look like sites of economic production that open up new forms of possible regulation. 

(2) CE transforms food "waste" into a source of public disorder.

- Tora Holmerg and colleagues have observed that sustaining the  circular flows envisioned by CE advocates places a heavy reliance on what they call "make-up work"--the constant "tidying" required to prevent "leaks" of resources out of the circular system and to sustain the neat ordering of that system on which circularity depends. 

- In the CE model, conventional, linear economic flows therefore become a domain of "disorder" into which valuable resources escape. 

- Part of the CE ordering process comes with the making of property rights in food waste itself, which incentivizes various actors to avoid waste and disorder.

- But the orderliness of CE also comes from the state regulation of those property rights--once recognized--to ensure that they are exercised in pursuit of public order and public health. 

- In this sense, circularity takes on a certain moral economy as well [@lohnes2021regulating]. 

So this is the first leg of my argument: the CE does two things -- it gives rise to "property" in food waste where it didn't exist before and it produces a new and specific concept of "public disorder" tied to economic and material flows that take place outside of the circle. 

</aside>

---

### What are "Police-like Powers" 🏡?

<aside class="notes">

These two elements of the CE I've highlighted--property and public order--seem to suggest a kind of natural "fit" with the logic of municipal governance captured in the legal concept known as the "police power".

In this part I am going to explain a bit about what the police power is, and why I think it might be important for understanding the nature municipal food waste governance. 

So, what is the "police power"? It does not, as the name would suggest, have anything really to do with authority over municipal policing or police officers. 

The term "police" here harkens back to a much older set of meanings attached to this idea as a form of public regulation. 

</aside>

--

<small style="text-align: left;">

"By the **public police and oeconomy** I mean the due regulation and domestic order of the kingdom: whereby the individuals of the state, like **members of a well-governed family**, are bound to conform their general behaviour to the rules of propriety, good  neighbourhood, and good manners; and to be decent, industrious, and inoffensive in their respective stations."

<p style="text-align:right"> William Blackstone, <em>Commentaries on the Laws of England</em></p>

</small>

<aside class="notes">

A few features of Blackstone's definition are worth noting:

- It links "police" with "economy", which as Markus Dubber has pointed out, goes way back to early Greek writing on economics in its literal sense of "government of the household for the common good of the whole family" [@dubber2005police, 1280-1]. 

- By turning to the ideas of "domestic order" and the "well-governed family", Blackstone is invoking the picture of a very different kind of governance from liberal state regulation. Fundamental to these ideas, as they came to be understood, is the exercise of a broad *discretion* by the head of the household to meet problems of disorder and indecency as they arise in the course of everyday life.

These ideas in Blackstone were picked up enthusiastically by the early architects of the American constitutional order and later the American courts, who came associate a wide range of government actions with state governance as "household management". This idea became particularly important for local governments, where the types of regulatory concerns and the practice of governance found an easy fit with the goal of a well-ordered municipal household.

In Canada, and in Britain before it, Blackstone's formulation of police received a much more cautious reception. As Mariana Valverde has observed, one mostly searches the Canadian law books in vain for any reference to "police power"--though she also notes that it is exactly this void that makes the idea such a good one to think with [@valverde2006PeaceOrderGood, 73-75].

</aside>

--

<small style="text-align: left;">

"Their Lordships consider that the powers intended to be conferred by the Act in question, when properly understood, are to make **regulations in the nature of police or municipal regulations of a merely local character** for the good government of taverns, etc., licensed for the sale of liquors by retail, and such as are calculated to preserve, in the municipality, peace and public decency, and repress drunkenness and disorderly and riotous conduct. As such they cannot be said to interfere with the general regulation of trade and commerce which belongs to the Dominion Parliament [...]"

<p style="text-align:right"><em>Hodge v the Queen</em> [1883] UKPC 59, 9 AC 117</p>

</small>

<aside class="notes">

In *Hodge*, the defendant tavern owner was convicted of permitting the use of his billiard table after 7pm--an after-hours activity that was prohibited by the local liquor licence commissioners (a municipal body delegated its powers by the province). Hodge challenged the prohibition on billiard playing as *ultra vires* the commissioners but the law lords disagreed, finding that the commissioners were within the scope of their powers to regulate the social disorders of alcohol *and* any of its associated activities, of which billiards were significant example.

*Hodge* offers a perfect illustration of the workings of the municipal police power. Whereas the explicit power granted to the commissioners was to regulate the sale of liquor, when funneled through the lens of police the scope of this power necessarily extended to matters--like billiards--that were entangled with the practice of selling and consuming liquor and which needed to be restrained in order to sustain public order. 

But by the same token, this kind of reading by the JCPC endowed the commissioners with a broad discretion to address the disorder caused by consuming liquor through whatever means they deemed necessary. This is "household management" in its purest form. 

Note also that the logic of the liquor regulations in *Hodge* was understood by the JCPC as one that was fundamentally about regulating property, not people. While the commissioners were no doubt interested in and mindful of the need to deter people from drinking too much, they exercised their authority in the mode of land use controls over the tavern owner's property. It was this property that was understood by the court in *Hodge* to be the proper subject of the police power. 

</aside>

--

#### *Municipal Government Act*, RSNS 1998, c 18

<small style="text-align: left;">

172 (1) A council may make by-laws, for municipal purposes,
respecting: 

 (a) the health, well being, safety and protection of persons; 

(b) the safety and protection of property; [...]

</small>

<aside class="notes">

Following *Hodge* in the early days after Confederation, discussion of the the common law doctrine concerning municipal police powers mostly died away in the courts, but was carried forward instead by seemingly innocuous provisions in municipal empower statutes. 

Do not have time to canvas this line of cases, but it is enough to note that these "general welfare" provisions have been broadly--if not explicitly--understood to endow local governments with police-like powers over (in the NS language) "the health well begin, safety and protection of persons and the safety and protection of property"--to whit, power to establish public order.

If we connect this discussion of police powers back to my earlier points about the circular food economy, the conclusion I'm suggesting is that the specific features of the CE ("property in waste" and the "the need to address a new kind of disorder") appear to raise exactly the kind of problem and exactly the kind of regulatory subject that municipality police powers have, historically, been applied to address. 

</aside>

--

### Organics bans 🗑️ are...

- Highly formalized (encoded in regs)
- Bright-line rules (universal in application)
- Designed for people (structure incentives)

--

### Police-like regulations 🏡 are...

- Informal (encoded in practices)
- Discretionary (particular to context )
- Designed for places (structure property)

#### Food Provisioning Bans in Public Spaces

![](fnb.jpg)

<small style="text-align: left;">Food Note Bombs Peterborough <br/> Source: *[Peterborough Examiner](https://www.thepeterboroughexaminer.com/news/council/food-not-bombs-handed-trespassing-notice-from-city-for-serving-food/article_3c047df2-05d7-5d48-aec4-2d1282f86798.html)*</small>

<aside class="notes">

- FNB had been serving free meals to unhoused people and others in need in Confederation Park across from City Hall for the past two decades.

- FNB participated in the circular food economy by preparing meals from donated "surplus" food from farmers, grocers and other community sources. 

- In 2019 Peterborough Council enacted a new Parks and Facilities By-law that prohibited BOTH "tenting" and "offering food" in public parks without a permit. Part of a larger trend in bylaws aimed at deterring use of public parks amid housing crisis. 

- Idea behind this bylaw was that Council was regulating not only public spaces but "public disorder" in the form tent cities used by unhoused people to meet their basic needs. By targeting another of those basic needs--the need to eat--Council was similarly regulating, i.e. attempting to prohibit or move elsewhere, this source of perceived disorder. 

- FNB protested application of the bylaw in 2021 by continuing to serve food in the square. 

- Acknowledging that as an "unincorporated association of individuals" FNB lacked "legal personhood" and therefore had no way to apply for a permit, city officials then worked with FNB and Council to negotiate an amendment to bylaw allowing the city to grant exemptions, on a case by case basis, for specific activities in Confederation Square.

- Result was that FNB was permitted to continue its participation in the circular food economy by a kind of negotiated and highly-discretionary loophole through which the city attempted to negotiate competing conceptions and sources of "public disorder" (sheltering by unhoused people in public parks and wasted food exiting the circular economy)

NB: I'm not saying that this is a "good" resolution -- only that it is descriptive of the kind of governmentality we tend to see in local governments attempts to address food waste in the complex environments in which they operate. 

</aside>
