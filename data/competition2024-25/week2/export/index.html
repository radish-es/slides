## What is Competition Law and Policy?

--

Area of law that seeks to regulate and promote competition in the Canadian economy:

- federal (*Competition Act*)
- "firm" as regulatory object

<aside class="notes">

Why is it interesting?

- relatively new and changing rapidly
- relationship between law and economics 

</aside>

--

#### Retail Grocery Market Share (2019)

![](canada_grocers_marketshare.jpg)

Should we be worried? How do we know? 

<aside class="notes">

Is market concentration (monopoly/oligopoly) inherently bad? Or only when it causes demonstrable harm? 

- Worries: collusion? abuse of dominant position (over competitors)? vertical constraints/power? Should focus be on harm to the consumer or/and others?

- What if a dominant firm is just really good at what it does, should it be penalized? Do we worry about distorting incentives? 

- What would the structuralists vs Chicago school have to say about this? What are the assumptions here? 

- Is there a difference between preventing vs breaking up concentrated markets? (RGMS: Bureau rejects idea of breaking up the big players)

- If we are worried about powerful monopolies, why prohibit collusive behaviour among smaller firms that might offset this power? 

</aside>

<!--#### Historical Development-->

![](competition-law-history.jpg)

<aside class="notes">

- US Sherman Act 1890 ("anti-trust" = large American industrialists who used trusts to consolidate companies); Section 2 = unlawful for any person to "monopolize, or attempt to monopolize, or combine or conspire with any other person or persons, to monopolize any part of the trade or commerce among the several States, or with foreign nations . . . ."

- Sherman Act motivated by coalition of farmers, small businesses and urban employees/consumers to combat "bigness" (but also logrolling - Senator Sherman was fierce protectionist)

- Parallels in Canada: e.g., railway companies, meat-packing, agricultural machinery, flour-milling (though Trebilcock argues Canadians were less ideologically committee to fighting 'bigness', e.g. acceptance of Hudsons Bay Co)

- 1889 *Wallace Act* = applied to firms who conspired or combined to "unduly prevent or lessen competition" (significant qualifier); "unlawfully" meant that behaviour also had to be unlawful at common law (which was very permissive - soon removed); "unduly" persisted

- Origins in criminal law = 1889 act created various criminal offenses

- Combines Investigation Act (1910) provided for mechanism to initiate investigations of anti-competitive behaviour; limited use and followed by a series of new or amended Acts allocating oversight and enforcement powers to various actors; very few prosecutions and a high level of uncertainty in the business community over the next 50+ years

- 1969 Economic Council of Canada report: (1) focus on economic efficiency; (2) hybrid criminal/civil approach; (3) creation of board of non-judicial experts to review mergers and other anti-competitive practices (non-criminal). Recommendations heavily contested

- Competition Act (1986) realized most of the 1969 recommendations and forms the basis of contemporary competition law in Canada. Deals with (1) horizontal conduct; (2) M&A; (3) single-firm practices 

- Significant amendments in 2009 (per se criminal conspiracy provisions; new private enforcement mechanisms;)

- Bill C-56 + C-59 (lower standards for abuse of dominance; provisions targeting "excessive and unfair selling prices"; new rules around anti-competitive collaborations, including between non-competitors; mergers efficiencies defence; right-to-repair; greenwashing/deceptive marketing practices; expanded private enforcement)

</aside>

<aside class="notes">

- corporate interests
- consumers
- economists (efficency; certainty of results)
- policy actors (e.g. food policy councils, right-to-repair groups)

## Purposes of Competition Law

<aside class="notes">

Purposes have always been heavily contested. Now more so than ever.

</aside>

--

**Competition is not really an end in itself.**

*So why do we care about maintaining and encouraging competition?*

--

### *Competition Act*, RSC , 1985, c. C-34

> <small> 1.1 The purpose of this Act is to maintain and encourage competition in Canada in order to promote the efficiency and adaptability of the Canadian economy, in order to expand opportunities for Canadian participation in world markets while at the same time recognizing the role of foreign competition in Canada, in order to ensure that small and medium-sized enterprises have an equitable opportunity to participate in the Canadian economy and in order to provide consumers with competitive prices and product choices.</small> 

**Are these purposes consistent with one another? Any tensions? Contradictions? Missing pieces?**

<aside class="notes">

Purposes:

- efficiency (what is this? should it be the only objective? is it more determinate than the others?)
- adaptability (what does this mean?)
- domestic protectionism? 
- protect small and medium businesses (why?)
- consumer prices, product quality and choice (consumer welfare)
- innovation? 

What about protection against political influence of bigness? (Pitofsky; historically important)

What about "redistribution" / "fairness"?

</aside>

---

### System Components

- Commissioner/Competition Bureau 
- Minister of Justice/AG
- Competition Tribunal
- Generalist Courts (Prov/Fed)
- Minister of Industry
- Private Parties

<aside class="notes">

Commissioner/Bureau: responsible for public enforcement -- investigations; bringing civil cases to CT; referring criminal cases to AG; policy advocacy 

Competition Tribunal: specialized tribunal with jurisdiction over civil practices provisions of CA (mergers, abuse of dominance, vertical restraints); membership = judges of federal court + lay members; proceeds resemble complex civil trials; appeals to FCA

Generalist Courts: hear criminal cases + civil suits for damages based on contravention of the CA

Minister of Industry: significant discretion re some reviewable practices, e.g. mergers 

Private parties: intermittent focus of competition regimes -- to what extent should non-state parties be involved in monitoring and enforcement? (E.g. s. 9 of CA allows and 6 people who are resident in Canada to apply to the Commissioner for an inquiry; other provisions allow for third-party access to the CT with leave, e.g. exclusive dealing, now abuse of dominance; s. 36 statutory cause of action for damages)

</aside>
